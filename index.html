<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proof Quest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================================
         Proof Quest
         Quest Select
    ========================================================== -->

    <main class="stage-select">

        <!-- =====================================================
             ヘッダー
             Stage画面と同じ構造にする
        ====================================================== -->

        <header class="stage-select-header">

    <!-- 左：Proof Quest -->
    <div class="stage-select-logo">

        <div class="stage-select-title">

            <span class="stage-select-icon">⚔</span>

            <h1>Proof Quest</h1>

        </div>

        <p>合同を求めて</p>

    </div>


    <!-- 中央：QUEST SELECT -->
    <div class="stage-select-quest">

        QUEST SELECT

    </div>

</header>


        <!-- =====================================================
             Stage選択
        ====================================================== -->

        <section class="stage-list">

            <!-- Stage 1 -->

            <button
                class="stage-select-item"
                type="button"
                onclick="location.href='game.html?stage=1'"
            >

                <span class="stage-number">
                    STAGE 01
                </span>

                <span class="stage-name">
                    鏡合わせの双子
                </span>

            </button>


            <!-- Stage 2 -->

            <button
                class="stage-select-item"
                type="button"
                onclick="location.href='game.html?stage=2'"
            >

                <span class="stage-number">
                    STAGE 02
                </span>

                <span class="stage-name">
                    角度の錬金術
                </span>

            </button>


            <!-- Stage 3 -->

<button
    class="stage-select-item"
    type="button"
    onclick="location.href='game.html?stage=3&part=1'"
>

    <span class="stage-number">
        STAGE 03
    </span>

    <span class="stage-name">
        合同のやまびこ
    </span>

</button>

        </section>

    </main>

</body>
</html>
