<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"> <defs> <style> .diagram-line { stroke: #333333; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; transition: stroke 0.25s ease, stroke-width 0.25s ease, filter 0.25s ease; } .diagram-point { fill: #333333; } .point-label { font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; font-size: 28px; font-weight: 900; fill: #172033; user-select: none; } .angle-hidden { opacity: 0; } .angle-hidden.highlight { opacity: 1; } </style> </defs> <!-- ===================================================== Stage 02 画像に対応した基本配置 A = (250,520) B = (735,520) C = (250,35) D = (575,360) E = (100,200) D は BC 上に配置 ===================================================== --> <!-- ===================================================== 角 ※線分より先に描画しておくことで、 線分が角の扇形をきれいに横切る ===================================================== --> <!-- ∠BAD AB と AD の間の角 --> <path id="angle_BAD" class="angle-hidden" d=" M 250 520 L 290 520 A 40 40 0 0 0 286.5 500.3 Z " /> <!-- ∠CAE AC と AE の間の角 --> <path id="angle_CAE" class="angle-hidden" d=" M 250 520 L 250 480 A 40 40 0 0 0 231.3 484.6 Z " /> <!-- ∠CAD AC と AD の間の共通角 --> <path id="angle_CAD" class="angle-hidden" d=" M 250 520 L 250 470 A 50 50 0 0 1 294.8 495.4 Z " /> <!-- ===================================================== 外側の大きな直角三角形 ABC ===================================================== --> <line id="line_AB" class="diagram-line" x1="250" y1="520" x2="735" y2="520" /> <line id="line_AC" class="diagram-line" x1="250" y1="520" x2="250" y2="35" /> <line id="line_BC" class="diagram-line" x1="735" y1="520" x2="250" y2="35" /> <!-- ===================================================== 内側の三角形・補助線 ===================================================== --> <line id="line_AD" class="diagram-line" x1="250" y1="520" x2="575" y2="360" /> <line id="line_AE" class="diagram-line" x1="250" y1="520" x2="100" y2="200" /> <line id="line_ED" class="diagram-line" x1="100" y1="200" x2="575" y2="360" /> <line id="line_EC" class="diagram-line" x1="100" y1="200" x2="250" y2="35" /> <!-- ===================================================== 点 ===================================================== --> <!-- A --> <circle id="point_A" class="diagram-point" cx="250" cy="520" r="6" /> <!-- B --> <circle id="point_B" class="diagram-point" cx="735" cy="520" r="6" /> <!-- C --> <circle id="point_C" class="diagram-point" cx="250" cy="35" r="6" /> <!-- D BC上に配置 --> --> <circle id="point_D" class="diagram-point" cx="575" cy="360" r="6" /> <!-- E --> <circle id="point_E" class="diagram-point" cx="100" cy="200" r="6" /> <!-- ===================================================== 点のラベル ===================================================== --> <text id="label_A" class="point-label" x="225" y="575" >A</text> <text id="label_B" class="point-label" x="720" y="575" >B</text> <text id="label_C" class="point-label" x="225" y="30" >C</text> <text id="label_D" class="point-label" x="595" y="355" >D</text> <text id="label_E" class="point-label" x="48" y="190" >E</text> </svg>